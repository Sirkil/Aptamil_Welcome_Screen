<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0344af">
  <meta name="description" content="Aptamil Innovation Pavilion welcome screen">
  <title>Welcome · Aptamil Innovation Pavilion</title>
  <link rel="icon" href="./aptamil-mark.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="welcome-screen" class="screen" aria-live="polite">
    <div class="light-band light-band-back" aria-hidden="true"></div>
    <div class="light-band light-band-front" aria-hidden="true"></div>
    <div class="display">
      <div class="brand" aria-label="Aptamil Innovation Pavilion">
        <img src="./aptamil-mark.png" alt="Aptamil Innovation Pavilion">
      </div>
      <div class="divider" aria-hidden="true"></div>
      <div class="message">
        <section id="idle" class="scene is-visible">
          <p class="eyebrow">Welcome</p>
          <h1><em>Aptamil Lunch Event</em></h1>
        </section>
        <section id="greeting" class="scene" aria-atomic="true">
          <p class="eyebrow">Welcome</p>
          <h1 id="guest-name" class="guest-name"></h1>
        </section>
        <section id="unknown" class="scene" aria-atomic="true">
          <p class="eyebrow">Welcome</p>
          <h1>Please see our team</h1>
          <p id="unknown-message" class="unknown-message">We’ll help you with your tag.</p>
        </section>
      </div>
    </div>
    <p id="reader-status" class="reader-status" role="status"></p>
  </main>
  <main id="control-screen" class="control-screen" hidden>
    <header class="control-header">
      <h1 tabindex="-1">Welcome screen controls</h1>
      <button id="show-welcome" type="button">Show welcome screen</button>
    </header>
    <div class="control-grid">
      <section>
        <h2>Arduino Nano</h2>
        <p id="arduino-status" class="device-status" role="status">Disconnected</p>
        <div class="control-actions">
          <button id="arduino-connect" type="button">Connect Arduino</button>
          <button id="arduino-test" type="button" disabled>Test LEDs</button>
        </div>
      </section>
      <section>
        <h2>R20C scanner</h2>
        <p id="scanner-status" class="device-status" role="status">Waiting for a scan</p>
        <p class="control-hint">Tap a tag on the reader to verify it.</p>
      </section>
      <section>
        <h2>Registration database</h2>
        <p id="database-status" class="device-status" role="status">Checking connection…</p>
      </section>
    </div>
    <p class="control-hint">Press <kbd>Q</kbd> to switch screens.</p>
  </main>
  <script src="./config.js" defer></script>
  <script src="./arduino.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
